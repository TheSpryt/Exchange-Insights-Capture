displayName=Exchange Insights Capture
author=TheSpryt
description=Instant replay for Old School RuneScape, in the style of ShadowPlay. The plugin holds the last few seconds of play in memory and writes an MP4 when something worth keeping happens: a death, a boss kill, a collection log slot, a rare drop. A hotkey saves one whenever you want. You choose the clip length, framerate, quality, how much to keep recording after the event, and which events count at all. Clips go into folders named for your account and what triggered them, the way RuneLite files screenshots.
tags=record,recording,video,clip,replay,mp4,death,collection,log,capture,highlight,shadowplay
version=0.1
plugins=com.exchangeinsightscapture.ExchangeInsightsCapturePlugin
build=standard
