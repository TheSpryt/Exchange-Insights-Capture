displayName=Exchange Insights Capture
author=TheSpryt
description=ShadowPlay-style instant replay for Old School RuneScape. Continuously buffers the last few seconds of gameplay and automatically saves an MP4 clip of the moments leading up to (and just after) configurable in-game events such as deaths and collection log unlocks. Clip length, framerate, quality, post-event padding and trigger events are all configurable. Clips are saved locally and filed by account and trigger type, like RuneLite screenshots.
tags=record,recording,video,clip,replay,mp4,death,collection,log,capture,highlight,shadowplay
version=0.1
plugins=com.exchangeinsightscapture.ExchangeInsightsCapturePlugin
build=gradle
